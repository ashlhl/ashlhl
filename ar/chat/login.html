<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>اسهل حل | دخول</title>
    <!-- Google Fonts & Material Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        /* ========== الأنماط الأساسية ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: #f0f5fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            direction: rtl;
            color: #1e293b;
            font-size: 14px;
        }
        #app {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            background: #f0f5fa;
        }
        .top-bar {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 213, 225, 0.5);
            color: #4f46e5;
            border-radius: 40px;
            padding: 8px 14px;
            margin: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
        }
        .brand {
            font-weight: 900;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand i {
            font-size: 1.5rem;
            color: #4f46e5;
            filter: drop-shadow(0 2px 4px rgba(79, 70, 229, 0.2));
        }
        .menu-btn {
            background: transparent;
            border: none;
            color: #4f46e5;
            padding: 4px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #cbd5e1;
        }
        .menu-btn i {
            font-size: 1.8rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 30px;
            padding: 16px 12px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1),
                        0 0 0 1px rgba(255, 255, 255, 0.9) inset;
            border: 1px solid rgba(203, 213, 225, 0.5);
            display: flex;
            flex-direction: column;
            margin: 8px;
            flex: 1;
            overflow-y: auto;
        }
        .logo {
            text-align: center;
            margin-bottom: 12px;
        }
        .logo h1 {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 2px;
        }
        .logo p {
            color: #64748b;
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 6px;
            font-size: 0.8rem;
        }
        .input-field {
            width: 100%;
            padding: 10px 16px;
            margin: 4px 0;
            border: none;
            border-radius: 40px;
            font-size: 0.9rem;
            background: #ffffff;
            color: #1e293b;
            border: 2px solid #e2e8f0;
        }
        .input-field:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .btn {
            width: 100%;
            padding: 8px 14px;
            border: none;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 700;
            background: linear-gradient(145deg, #4f46e5, #6366f1);
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 4px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 6px 14px -6px rgba(79, 70, 229, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .btn i {
            font-size: 1.1rem;
        }
        .btn-success {
            background: linear-gradient(145deg, #10b981, #059669);
        }
        .btn-outline {
            background: transparent;
            color: #4f46e5;
            border: 2px solid #4f46e5;
            box-shadow: none;
        }
        .divider {
            margin: 12px 0;
            border-top: 2px solid #e2e8f0;
            position: relative;
        }
        .divider::after {
            content: "أو";
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 0 16px;
            color: #4f46e5;
            font-size: 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
        }
        .join-section {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 6px 0;
        }
        .join-section button {
            width: auto;
            padding: 8px 16px;
        }
        .note {
            font-size: 0.75rem;
            color: #64748b;
        }
        .error {
            color: #dc2626;
            font-size: 0.75rem;
            text-align: center;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
        }
        #custom-key-container {
            display: none;
        }
        #custom-key-container.show {
            display: block;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: auto;
            padding-top: 8px;
            font-size: 0.75rem;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: #4f46e5;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            z-index: 9999;
            display: none;
            box-shadow: 0 15px 30px -8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- الشريط العلوي -->
        <div class="top-bar">
            <span class="brand"><i class="material-icons">chat</i> اسهل حل</span>
            <button class="menu-btn" id="homeBtn" onclick="window.location.href='index.html'"><i class="material-icons">home</i></button>
        </div>

        <!-- بطاقة الدخول -->
        <div class="card">
            <div class="logo">
                <h1>اسهل حل</h1>
                <p>دخول إلى المحادثة</p>
            </div>
            <input type="text" id="username-input" class="input-field" placeholder="اسمك (اتركه فارغاً لاسم عشوائي)" maxlength="20">
            <div class="checkbox-wrapper">
                <input type="checkbox" id="manual-code-checkbox">
                <label for="manual-code-checkbox">استخدام مفتاح مخصص</label>
            </div>
            <div id="custom-key-container">
                <input type="text" id="custom-room-input" class="input-field" placeholder="المفتاح (أرقام)" maxlength="6">
            </div>
            <button id="create-room-btn" class="btn"><i class="material-icons">add_circle</i> إنشاء غرفة جديدة</button>
            <div class="divider"></div>
            <p style="text-align:center; font-weight:600; margin-bottom:6px;">أو انضم إلى غرفة موجودة</p>
            <div class="join-section">
                <input type="text" id="room-code-input" class="input-field" placeholder="مفتاح الغرفة" maxlength="6">
                <button id="join-room-btn" class="btn btn-outline"><i class="material-icons">door_front</i> انضمام</button>
            </div>
            <button id="public-room-btn" class="btn btn-success"><i class="material-icons">group</i> غرفة للجميع (عامة)</button>
            <div id="error-message" class="error"></div>

            <div class="footer-links">
                <a href="help.html"><i class="material-icons">help</i> مساعدة</a>
                <a href="about.html"><i class="material-icons">info</i> حول</a>
                <a href="privacy.html"><i class="material-icons">lock</i> الخصوصية</a>
            </div>
        </div>
    </div>

    <!-- الإشعارات -->
    <div id="notification" class="toast"></div>

    <script type="module">
        // ================== استيراد Firebase ==================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAG4EKrB3iLEV2hsB8b08ShpSO6PXDnGjg",
            authDomain: "zio3-8ffdd.firebaseapp.com",
            databaseURL: "https://zio3-8ffdd-default-rtdb.firebaseio.com",
            projectId: "zio3-8ffdd",
            storageBucket: "zio3-8ffdd.firebasestorage.app",
            messagingSenderId: "560939348415",
            appId: "1:560939348415:web:c854e9e214e498ad2d310a",
            measurementId: "G-CVN2B2D0RD"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ================== عناصر DOM ==================
        const usernameInput = document.getElementById('username-input');
        const roomCodeInput = document.getElementById('room-code-input');
        const customRoomInput = document.getElementById('custom-room-input');
        const manualCheckbox = document.getElementById('manual-code-checkbox');
        const customContainer = document.getElementById('custom-key-container');
        const createBtn = document.getElementById('create-room-btn');
        const joinBtn = document.getElementById('join-room-btn');
        const publicBtn = document.getElementById('public-room-btn');
        const errorDiv = document.getElementById('error-message');
        const notification = document.getElementById('notification');

        // ================== دوال مساعدة ==================
        function showNotification(msg, type = 'success') {
            if (!notification) return;
            notification.textContent = msg;
            notification.style.background = type === 'success' ? '#10b981' : '#ef4444';
            notification.style.display = 'block';
            setTimeout(() => notification.style.display = 'none', 2000);
        }

        function isValidRoomCode(code) { return /^\d{3,6}$/.test(code); }
        function generateRandomCode() { return Math.floor(1000 + Math.random() * 9000).toString(); }
        function generateRandomName() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            return Array.from({ length: 5 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
        }

        // ===== محاولة دخول الغرفة وتخزين البيانات =====
        async function attemptEnterRoom(roomCode, userName) {
            // التحقق من صحة الرمز
            if (!roomCode || !isValidRoomCode(roomCode)) {
                errorDiv.textContent = 'المفتاح يجب أن يكون 3-6 أرقام';
                return false;
            }

            // التحقق من وجود الغرفة (إذا كانت موجودة مسبقاً، لا مشكلة)
            const roomRef = ref(db, `rooms/${roomCode}/info`);
            const roomSnap = await get(roomRef);
            if (!roomSnap.exists()) {
                // إذا كانت غير موجودة، نقوم بإنشائها (لاحظ أن الزر "إنشاء" يؤدي إلى نفس الشيء)
                // ولكن هنا سنسمح بذلك تلقائياً للانضمام؟ الأفضل أن نمنع الانضمام لغرفة غير موجودة
                // ولكن في حالة الإنشاء سنقوم بإنشائها بعد التأكد.
                // لذلك سنترك هذا للدوال الخاصة.
                return false;
            }

            // تخزين البيانات في sessionStorage
            sessionStorage.setItem('currentRoom', roomCode);
            sessionStorage.setItem('currentUser', userName);
            return true;
        }

        // ===== إنشاء غرفة جديدة (مع إنشائها إذا لم تكن موجودة) =====
        async function createRoom(roomCode, userName) {
            try {
                const roomRef = ref(db, `rooms/${roomCode}/info`);
                const roomSnap = await get(roomRef);
                if (!roomSnap.exists()) {
                    await set(roomRef, { createdAt: Date.now(), createdBy: userName });
                }
                sessionStorage.setItem('currentRoom', roomCode);
                sessionStorage.setItem('currentUser', userName);
                return true;
            } catch (err) {
                errorDiv.textContent = 'خطأ في الاتصال: ' + err.message;
                return false;
            }
        }

        // ===== حدث إنشاء غرفة =====
        createBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            let name = usernameInput.value.trim();
            if (!name) name = generateRandomName();
            let code;
            if (manualCheckbox.checked) {
                code = customRoomInput.value.trim();
                if (!code || !isValidRoomCode(code)) {
                    errorDiv.textContent = 'المفتاح يجب أن يكون 3-6 أرقام';
                    return;
                }
            } else {
                code = generateRandomCode();
            }
            errorDiv.textContent = '';
            const success = await createRoom(code, name);
            if (success) {
                showNotification('تم إنشاء الغرفة والدخول');
                window.location.href = 'chat.html';
            }
        });

        // ===== حدث الانضمام إلى غرفة موجودة =====
        joinBtn.addEventListener('click', async () => {
            let name = usernameInput.value.trim();
            const code = roomCodeInput.value.trim();
            if (!code) { errorDiv.textContent = 'أدخل مفتاح الغرفة'; return; }
            if (!isValidRoomCode(code)) { errorDiv.textContent = 'المفتاح 3-6 أرقام'; return; }
            if (!name) name = generateRandomName();
            errorDiv.textContent = '';

            const roomRef = ref(db, `rooms/${code}/info`);
            const roomSnap = await get(roomRef);
            if (!roomSnap.exists()) {
                errorDiv.textContent = 'المفتاح غير صحيح';
                return;
            }

            sessionStorage.setItem('currentRoom', code);
            sessionStorage.setItem('currentUser', name);
            showNotification('تم الانضمام');
            window.location.href = 'chat.html';
        });

        // ===== حدث الغرفة العامة =====
        publicBtn.addEventListener('click', async () => {
            let name = usernameInput.value.trim();
            if (!name) name = generateRandomName();
            const PUBLIC_ROOM_CODE = "1000";
            errorDiv.textContent = '';

            const roomRef = ref(db, `rooms/${PUBLIC_ROOM_CODE}/info`);
            const roomSnap = await get(roomRef);
            if (!roomSnap.exists()) {
                await set(roomRef, { createdAt: Date.now(), createdBy: 'system', public: true });
            }

            sessionStorage.setItem('currentRoom', PUBLIC_ROOM_CODE);
            sessionStorage.setItem('currentUser', name);
            showNotification('مرحباً بك في الغرفة العامة');
            window.location.href = 'chat.html';
        });

        // ===== إظهار/إخفاء حقل المفتاح المخصص =====
        manualCheckbox.addEventListener('change', () => {
            if (manualCheckbox.checked) {
                customContainer.classList.add('show');
            } else {
                customContainer.classList.remove('show');
            }
        });

        // ===== منع إدخال غير الأرقام =====
        [customRoomInput, roomCodeInput].forEach(i => i.addEventListener('input', function() { this.value = this.value.replace(/\D/g, ''); }));

        // ===== عند تحميل الصفحة، نمسح أي جلسة سابقة (اختياري) =====
        sessionStorage.removeItem('currentRoom');
        sessionStorage.removeItem('currentUser');
    </script>
</body>
</html>
