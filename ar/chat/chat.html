        // ===== دالة جلب مفتاح GitHub =====
        async function getGitHubToken() {
            try {

                const snapshot = await get(tokenRef);
                if (snapshot.exists()) {

                }

        // ===== ضغط الصورة =====
        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width, height = img.height;
                        if (width > maxWidth || height > maxWidth) {
                            if (width > height) {
                                height = Math.round(height * (maxWidth / width));
                                width = maxWidth;
                            } else {
                                width = Math.round(width * (maxWidth / height));
                                height = maxWidth;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ===== ضغط الفيديو إلى 720p (webm) =====
        async function compressVideo(file, targetWidth = 1280, targetHeight = 720) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.onloadedmetadata = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = targetWidth;
                    canvas.height = targetHeight;
                    const ctx = canvas.getContext('2d');
                    const stream = canvas.captureStream(30);
                    const mimeType = 'video/webm; codecs=vp8,opus';
                    const recorder = MediaRecorder.isTypeSupported(mimeType) ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
                    const chunks = [];

                    recorder.ondataavailable = (e) => chunks.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        resolve(blob);
                    };

                    video.currentTime = 0;
                    video.play();

                    const drawFrame = () => {
                        if (!video.paused && !video.ended) {
                            ctx.drawImage(video, 0, 0, targetWidth, targetHeight);
                            requestAnimationFrame(drawFrame);
                        }
                    };

                    video.onseeked = () => {
                        drawFrame();
                        recorder.start();
                        video.addEventListener('ended', () => {
                            recorder.stop();
                            video.pause();
                        });
                    };

                    video.onerror = () => reject('فشل معالجة الفيديو');
                };
                video.onerror = () => reject('لا يمكن قراءة الفيديو');
                video.src = URL.createObjectURL(file);
            });
        }

        // ===== التحقق من الفيديو وضغطه إذا لزم الأمر =====
        async function validateAndCompressVideo(file) {
            if (file.size <= 10 * 1024 * 1024) {
                return file;
            }
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.onloadedmetadata = async () => {
                    URL.revokeObjectURL(video.src);
                    const duration = video.duration;
                    const width = video.videoWidth;
                    const height = video.videoHeight;

                    if (duration > 60) {
                        reject(`مدة الفيديو تتجاوز دقيقة واحدة (${Math.round(duration)} ثانية)`);
                        return;
                    }

                    if (width > 1280 || height > 720) {
                        showNotification('جاري ضغط الفيديو إلى 720p...');
                        try {
                            const compressedBlob = await compressVideo(file, 1280, 720);
                            const compressedFile = new File([compressedBlob], file.name.replace(/\.[^/.]+$/, '') + '.webm', { type: 'video/webm' });
                            resolve(compressedFile);
                        } catch (err) {
                            reject('فشل ضغط الفيديو: ' + err);
                        }
                    } else {
                        resolve(file);
                    }
                };
                video.onerror = () => reject('لا يمكن قراءة الفيديو');
                video.src = URL.createObjectURL(file);
            });
        }

        // ===== رفع الملف إلى GitHub =====
        function uploadFileToGitHub(file, roomCode, userId, onProgress) {
            return new Promise(async (resolve, reject) => {
                const token = await getGitHubToken();
                if (!token) { reject('مفتاح GitHub غير متوفر'); return; }

                const GITHUB_USERNAME = "ashlhl";
                const REPO_NAME = "ashlhl";
                const BRANCH = "main";
                const REMOTE_FOLDER = "uploads";

                let fileToUpload = file;

                if (file.type.startsWith('image/') && !file.type.includes('gif')) {
                    try {
                        fileToUpload = await compressImage(file);
                    } catch (err) { console.warn('فشل ضغط الصورة', err); }
                }

                if (file.type.startsWith('video/')) {
                    try {
                        fileToUpload = await validateAndCompressVideo(file);
                    } catch (err) {
                        reject(err);
                        return;
                    }
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result.split(',')[1];
                    const timestamp = Date.now();
                    const rand = Math.floor(Math.random() * 9000) + 1000;
                    const remoteName = `${timestamp}_${rand}_${file.name}`;
                    const remotePath = `${REMOTE_FOLDER}/${roomCode}/${remoteName}`;
                    const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${remotePath}`;

                    const data = JSON.stringify({
                        message: `رفع ملف ${remoteName}`,
                        content: base64,
                        branch: BRANCH
                    });

                    const xhr = new XMLHttpRequest();
                    xhr.open('PUT', url, true);
                    xhr.setRequestHeader('Authorization', `token ${token}`);
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    xhr.setRequestHeader('Accept', 'application/vnd.github+json');

                    if (onProgress) {
                        xhr.upload.addEventListener('progress', (e) => {
                            if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
                        });
                    }

                    xhr.onload = () => {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            try {
                                const json = JSON.parse(xhr.responseText);
                                const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/${BRANCH}/${remotePath}`;
                                resolve({ url: rawUrl, path: remotePath });
                            } catch (err) { reject('فشل تحليل استجابة GitHub'); }
                        } else {
                            let errorMsg = `خطأ ${xhr.status}`;
                            try { const errJson = JSON.parse(xhr.responseText); errorMsg = errJson.message || errorMsg; } catch (e) {}
                            reject(errorMsg);
                        }
                    };
                    xhr.onerror = () => reject('فشل الاتصال بـ GitHub');
                    xhr.send(data);
                };
                reader.onerror = () => reject('فشل قراءة الملف');
                reader.readAsDataURL(fileToUpload);
            });
        }

        // ===== حذف ملف من GitHub =====
        async function deleteFileFromGitHub(githubPath) {
            const token = await getGitHubToken();
            if (!token) return false;

            const GITHUB_USERNAME = "ashlhl";
            const REPO_NAME = "ashlhl";
            const BRANCH = "main";

            try {
                const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${githubPath}?ref=${BRANCH}`;
                const getResp = await fetch(url, { headers: { "Authorization": "token " + token } });
                if (!getResp.ok) return false;
                const fileInfo = await getResp.json();
                const sha = fileInfo.sha;

                const deleteUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${githubPath}`;
                const deleteResp = await fetch(deleteUrl, {
                    method: "DELETE",
                    headers: {
                        "Authorization": "token " + token,
                        "Content-Type": "application/json",
                        "Accept": "application/vnd.github+json"
                    },
                    body: JSON.stringify({ message: `حذف ملف`, sha: sha, branch: BRANCH })
                });
                return deleteResp.ok;
            } catch (error) {
                console.error('فشل حذف الملف من GitHub:', error);
                return false;
            }
        }

        // ===== دوال الدردشة =====
        function displayMessage(msg, isOwn, isSystem, msgId) {
            if (msgId && displayedMessages.has(msgId)) return;
            if (msgId) displayedMessages.add(msgId);
            const div = document.createElement('div');
            div.className = `message ${isOwn ? 'own' : ''} ${isSystem ? 'system' : ''}`;
            div.dataset.msgId = msgId;
            if (!isSystem) {
                const nameSpan = document.createElement('div');
                nameSpan.className = 'username';
                if (msg.sender === ADMIN_LOGIN) {
                    nameSpan.textContent = ADMIN_DISPLAY;
                } else {
                    nameSpan.textContent = msg.sender;
                }
                if (msg.sender === ADMIN_LOGIN) {
                    const adminIcon = document.createElement('i');
                    adminIcon.className = 'material-icons';
                    adminIcon.style.fontSize = '0.7rem';
                    adminIcon.style.color = '#fbbf24';
                    adminIcon.textContent = 'verified';
                    nameSpan.appendChild(adminIcon);
                }
                div.appendChild(nameSpan);
            }
            if (msg.type === 'image') {
                const img = document.createElement('img');
                img.src = msg.text;
                img.alt = 'صورة';
                img.loading = 'lazy';
                img.addEventListener('click', () => { modalMediaContainer.innerHTML = `<img src="${msg.text}" class="modal-media">`; mediaModal.classList.add('active'); });
                div.appendChild(img);
            } else if (msg.type === 'video') {
                const video = document.createElement('video');
                video.src = msg.text;
                video.controls = true;
                video.preload = 'metadata';
                video.addEventListener('play', function() {
                    const allVideos = document.querySelectorAll('video');
                    allVideos.forEach(v => {
                        if (v !== video && !v.paused) {
                            v.pause();
                        }
                    });
                });
                video.addEventListener('click', () => { modalMediaContainer.innerHTML = `<video src="${msg.text}" controls class="modal-media"></video>`; mediaModal.classList.add('active'); });
                video.onerror = () => {
                    const errorSpan = document.createElement('span');
                    errorSpan.innerHTML = '<i class="material-icons" style="font-size:1rem; vertical-align:middle;">warning</i> فشل تحميل الفيديو';
                    errorSpan.style.color = 'red';
                    div.replaceChild(errorSpan, video);
                };
                div.appendChild(video);
            } else if (msg.type === 'audio') {
                const audio = document.createElement('audio');
                audio.src = msg.text;
                audio.controls = true;
                audio.preload = 'metadata';
                audio.addEventListener('click', () => { modalMediaContainer.innerHTML = `<audio src="${msg.text}" controls class="modal-media"></audio>`; mediaModal.classList.add('active'); });
                audio.onerror = () => {
                    const errorSpan = document.createElement('span');
                    errorSpan.innerHTML = '<i class="material-icons" style="font-size:1rem; vertical-align:middle;">warning</i> فشل تحميل الصوت';
                    errorSpan.style.color = 'red';
                    div.replaceChild(errorSpan, audio);
                };
                div.appendChild(audio);
            } else {
                div.appendChild(document.createTextNode(msg.text));
            }
            const timeSpan = document.createElement('div');
            timeSpan.className = 'time';
            timeSpan.textContent = new Date(msg.timestamp).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            div.appendChild(timeSpan);

            if (!isSystem) {
                const replyBtn = document.createElement('button');
                replyBtn.className = 'reply-btn';
                replyBtn.innerHTML = '<i class="material-icons" style="font-size:1rem;">reply</i>';
                replyBtn.addEventListener('click', () => { messageInput.value = `@${msg.sender} `; messageInput.focus(); });
                div.appendChild(replyBtn);
            }

            if (!isSystem && (isAdmin || msg.sender === currentUser)) {
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '<i class="material-icons" style="font-size:1rem;">delete</i>';
                deleteBtn.title = 'حذف الرسالة';
                deleteBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (confirm('هل أنت متأكد من حذف هذه الرسالة؟')) {
                        await deleteMessage(msgId, msg);
                    }
                });
                div.appendChild(deleteBtn);
            }
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function deleteMessage(msgId, msg) {
            if (!currentRoom || !msgId) return;
            if (msg.type === 'image' || msg.type === 'video' || msg.type === 'audio') {
                const url = msg.text;
                const match = url.match(/\/uploads\/(.+)$/);
                if (match) {
                    const githubPath = 'uploads/' + match[1];
                    await deleteFileFromGitHub(githubPath);
                }
            }
            try {
                await remove(ref(db, `rooms/${currentRoom}/messages/${msgId}`));
                showNotification('تم حذف الرسالة');
            } catch (error) {
                showNotification('فشل حذف الرسالة', 'danger');
            }
        }

        async function deleteOldMessages(room) {
            const msgsRef = ref(db, `rooms/${room}/messages`);
            const snap = await get(msgsRef);
            if (!snap.exists()) return;
            const msgs = snap.val();
            const ids = Object.keys(msgs).map(k => ({ id: k, ts: msgs[k].timestamp })).sort((a,b) => a.ts - b.ts);
            if (ids.length > MAX_MSGS) {
                const toDelete = ids.slice(0, ids.length - MAX_MSGS);
                for (const msg of toDelete) {
                    const msgData = msgs[msg.id];
                    if (msgData.type === 'image' || msgData.type === 'video' || msgData.type === 'audio') {
                        const url = msgData.text;
                        const match = url.match(/\/uploads\/(.+)$/);
                        if (match) {
                            const githubPath = 'uploads/' + match[1];
                            await deleteFileFromGitHub(githubPath);
                        }
                    }
                    await remove(ref(db, `rooms/${room}/messages/${msg.id}`));
                }
            }
        }

        async function kickUser(targetUserId, targetName) {
            if (!isAdmin || !currentRoom) return;
            if (targetUserId === userId) {
                showNotification('لا يمكن طرد نفسك', 'danger');
                return;
            }
            if (targetName === ADMIN_LOGIN) {
                showNotification('لا يمكن طرد المدير', 'danger');
                return;
            }
            if (confirm(`هل أنت متأكد من طرد ${targetName}؟`)) {
                await remove(ref(db, `rooms/${currentRoom}/users/${targetUserId}`));
                await remove(ref(db, `rooms/${currentRoom}/typing/${targetUserId}`));
                await push(ref(db, `rooms/${currentRoom}/messages`), {
                    sender: 'نظام',
                    text: `تم طرد ${targetName} بواسطة المدير`,
                    timestamp: Date.now()
                });
                showNotification(`تم طرد ${targetName}`);
            }
        }

        function updateUsersLists(users) {
            const count = Object.keys(users).length;
            userCountSpan.textContent = `(${count})`;

            // تحديث قائمة المتصلين المنبثقة
            if (popupUsersList) {
                popupUsersList.innerHTML = '';
                Object.keys(users).forEach(key => {
                    const user = users[key];
                    const item = document.createElement('div');
                    item.className = 'user-item';
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'user-name';
                    nameSpan.textContent = (user.name === ADMIN_LOGIN) ? ADMIN_DISPLAY : user.name;
                    item.appendChild(nameSpan);
                    if (user.name === ADMIN_LOGIN) {
                        const adminIcon = document.createElement('i');
                        adminIcon.className = 'material-icons';
                        adminIcon.style.color = '#fbbf24';
                        adminIcon.textContent = 'verified';
                        item.appendChild(adminIcon);
                    }
                    if (isAdmin && key !== userId && user.name !== ADMIN_LOGIN) {
                        const kickIcon = document.createElement('button');
                        kickIcon.className = 'kick-btn';
                        kickIcon.innerHTML = '<i class="material-icons">exit_to_app</i>';
                        kickIcon.title = 'طرد المستخدم';
                        kickIcon.addEventListener('click', (e) => {
                            e.stopPropagation();
                            kickUser(key, user.name);
                        });
                        item.appendChild(kickIcon);
                    }
                    popupUsersList.appendChild(item);
                });
            }
        }

        function monitorRoomUsers(room) {
            const usersRef = ref(db, `rooms/${room}/users`);
            if (usersUnsubscribe) usersUnsubscribe();
            usersUnsubscribe = onValue(usersRef, snap => {
                const users = snap.val() || {};
                updateUsersLists(users);
                if (Object.keys(users).length === 0) {
                    remove(ref(db, `rooms/${room}`));
                }
            });
        }

        function setupTyping(room, uid) {
            const typingRef = ref(db, `rooms/${room}/typing/${uid}`);
            messageInput.addEventListener('input', () => {
                if (messageInput.value.trim()) {
                    set(typingRef, true);
                    if (typingTimeout) clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => set(typingRef, false), 2000);
                } else set(typingRef, false);
            });
        }

        function listenTyping(room) {
            onValue(ref(db, `rooms/${room}/typing`), snap => {
                const data = snap.val() || {};
                const usersTyping = Object.keys(data).filter(k => data[k] === true && k !== userId);
                typingIndicator.style.display = usersTyping.length ? 'block' : 'none';
            });
        }

        async function enterChat(room, name) {
            if (messagesUnsubscribe) messagesUnsubscribe();
            if (usersUnsubscribe) usersUnsubscribe();
            displayedMessages.clear();

            currentRoom = room;
            if (name === ADMIN_LOGIN) {
                currentUser = ADMIN_DISPLAY;
                isAdmin = true;
            } else {
                currentUser = name;
                isAdmin = false;
            }
            userId = generateUserId();

            roomNameDisplay.textContent = `غرفة ${room}`;
            userStatus.innerHTML = isAdmin ? 
                `<i class="material-icons" style="font-size:0.9rem; vertical-align:middle;">verified</i> ${currentUser} (مدير)` : 
                currentUser;

            const userRef = ref(db, `rooms/${room}/users/${userId}`);
            await set(userRef, { name: name, joinedAt: Date.now() });
            onDisconnect(userRef).remove();

            const roomInfoRef = ref(db, `rooms/${room}/info`);
            const roomInfoSnap = await get(roomInfoRef);
            if (!roomInfoSnap.exists()) {
                await set(roomInfoRef, { createdAt: Date.now(), createdBy: name });
            }

            await push(ref(db, `rooms/${room}/messages`), { sender: 'نظام', text: `${currentUser} دخل الغرفة`, timestamp: Date.now() });

            monitorRoomUsers(room);
            setupTyping(room, userId);
            listenTyping(room);

            messagesRef = ref(db, `rooms/${room}/messages`);
            const recentQuery = query(messagesRef, orderByChild('timestamp'), limitToLast(MAX_MSGS));
            messagesContainer.innerHTML = '';
            messagesContainer.appendChild(typingIndicator);

            messagesUnsubscribe = onChildAdded(recentQuery, async (snap) => {
                const m = snap.val();
                if (!m) return;
                displayMessage(m, (m.sender === name) && m.sender !== 'نظام', m.sender === 'نظام', snap.key);
                await deleteOldMessages(currentRoom);
            });

            messageInput.focus();
        }

        function leaveRoom() {
            if (currentRoom && userId) {
                push(ref(db, `rooms/${currentRoom}/messages`), { sender: 'نظام', text: `${currentUser} غادر الغرفة`, timestamp: Date.now() });
                remove(ref(db, `rooms/${currentRoom}/users/${userId}`));
                remove(ref(db, `rooms/${currentRoom}/typing/${userId}`));
            }
            if (messagesUnsubscribe) messagesUnsubscribe();
            if (usersUnsubscribe) usersUnsubscribe();
            displayedMessages.clear();
            currentRoom = currentUser = userId = messagesRef = null;
            isAdmin = false;
            messagesContainer.innerHTML = '';
            // العودة إلى صفحة الدخول
            window.location.href = 'login.html';
        }

        async function sendMediaFile(file) {
            if (!currentRoom || !currentUser) { showNotification('أنت لست في غرفة', 'danger'); return; }
            const type = file.type.startsWith('video/') ? 'video' : (file.type.startsWith('audio/') ? 'audio' : 'image');
            const maxSize = type === 'video' ? 10 * 1024 * 1024 : (type === 'audio' ? 5 * 1024 * 1024 : 5 * 1024 * 1024);
            if (file.size > maxSize) { showNotification('الملف كبير جداً', 'danger'); return; }
            if (!progressBar || !progressFill) return;
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';

            try {
                showNotification('جاري رفع...');
                const result = await uploadFileToGitHub(file, currentRoom, userId, (percent) => {
                    progressFill.style.width = percent + '%';
                });
                if (!result) throw new Error('فشل الرفع إلى GitHub');

                await push(messagesRef, {
                    sender: isAdmin ? ADMIN_LOGIN : currentUser,
                    text: result.url,
                    type: type,
                    timestamp: Date.now()
                });

                progressFill.style.width = '100%';
                setTimeout(() => { progressBar.style.display = 'none'; progressFill.style.width = '0%'; }, 500);
                showNotification('تم رفع الملف بنجاح');
            } catch (error) {
                console.error('فشل إرسال الملف:', error);
                showNotification('فشل الإرسال: ' + error, 'danger');
                progressBar.style.display = 'none';
            }
        }

        // ===== دوال التسجيل الصوتي =====
        async function startAudioRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioFile = new File([audioBlob], 'recording.webm', { type: 'audio/webm' });
                    await sendMediaFile(audioFile);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                audioBtn.innerHTML = '<i class="material-icons">stop</i> إيقاف';
                showNotification('جاري التسجيل ...');
            } catch (err) {
                showNotification('لا يمكن الوصول إلى الميكروفون', 'danger');
                console.error(err);
            }
        }

        function stopAudioRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                audioBtn.innerHTML = '<i class="material-icons">mic</i> تسجيل';
            }
        }

        // ================== استعادة بيانات الجلسة والدخول ==================
        (async function init() {
            const storedRoom = sessionStorage.getItem('currentRoom');
            const storedUser = sessionStorage.getItem('currentUser');
            if (!storedRoom || !storedUser) {
                // لا توجد بيانات جلسة، نوجه إلى صفحة الدخول
                window.location.href = 'login.html';
                return;
            }
            // التحقق من وجود الغرفة (اختياري)
            const roomRef = ref(db, `rooms/${storedRoom}/info`);
            const roomSnap = await get(roomRef);
            if (!roomSnap.exists()) {
                showNotification('الغرفة غير موجودة', 'danger');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                return;
            }
            await enterChat(storedRoom, storedUser);
        })();

        // ================== أحداث الأزرار ==================
        sendBtn.addEventListener('click', async () => {
            const text = messageInput.value.trim();
            if (!text || !currentRoom) return;
            await push(messagesRef, { 
                sender: isAdmin ? ADMIN_LOGIN : currentUser, 
                text, 
                timestamp: Date.now() 
            });
            messageInput.value = '';
            if (currentRoom && userId) set(ref(db, `rooms/${currentRoom}/typing/${userId}`), false);
        });

        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });

        attachBtn.addEventListener('click', () => { fileInput.click(); mediaPopup.classList.remove('show'); });
        cameraBtn.addEventListener('click', () => { cameraInput.click(); mediaPopup.classList.remove('show'); });
        audioBtn.addEventListener('click', () => {
            if (!isRecording) {
                startAudioRecording();
            } else {
                stopAudioRecording();
            }
            mediaPopup.classList.remove('show');
        });

        fileInput.addEventListener('change', (e) => { if (e.target.files[0]) sendMediaFile(e.target.files[0]); fileInput.value = ''; });
        cameraInput.addEventListener('change', (e) => { if (e.target.files[0]) sendMediaFile(e.target.files[0]); cameraInput.value = ''; });

        leaveBtn.addEventListener('click', leaveRoom);

        copyBtn.addEventListener('click', () => {
            if (currentRoom) navigator.clipboard.writeText(currentRoom).then(() => showNotification('تم نسخ المفتاح'));
        });

        mediaBtn.addEventListener('click', () => mediaPopup.classList.toggle('show'));
        document.addEventListener('click', (e) => {
            if (mediaBtn && mediaPopup && !mediaBtn.contains(e.target) && !mediaPopup.contains(e.target)) {
                mediaPopup.classList.remove('show');
            }
        });

        toggleUsersBtn.addEventListener('click', () => {
            usersPopup.classList.toggle('show');
            popupOverlay.classList.toggle('show');
        });
        popupOverlay.addEventListener('click', () => {
            usersPopup.classList.remove('show');
            popupOverlay.classList.remove('show');
        });

        closeModalBtn.addEventListener('click', () => { mediaModal.classList.remove('active'); modalMediaContainer.innerHTML = ''; });
        modalBackBtn.addEventListener('click', () => { mediaModal.classList.remove('active'); modalMediaContainer.innerHTML = ''; });

        // منع إدخال غير الأرقام في حال وجود أي حقل (ليس ضرورياً هنا)
    </script>
</body>
